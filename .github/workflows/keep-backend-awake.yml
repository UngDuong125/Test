# Giữ backend Render (gói Free) thức trong giờ học, 06:00–22:00 giờ Việt Nam (UTC+7).
# GitHub cron dùng giờ UTC.
# 06:00–06:50 VN = 23:00–23:50 UTC, 07:00–21:50 VN = 00:00–14:50 UTC, 22:00 VN = 15:00 UTC.
# Cần repository variable BACKEND_URL (vd: https://ten-app.onrender.com).
name: Keep backend awake (school hours)

on:
  schedule:
    - cron: '*/10 23 * * *'
    - cron: '*/10 0-14 * * *'
    - cron: '0 15 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping /api/health
        env:
          BACKEND_URL: ${{ vars.BACKEND_URL }}
        run: |
          if [ -z "$BACKEND_URL" ]; then
            echo "::error::Chưa cấu hình repository variable BACKEND_URL"
            exit 1
          fi
          curl -fsS --retry 5 --retry-delay 15 --retry-all-errors --max-time 90 \
            "${BACKEND_URL%/}/api/health"
